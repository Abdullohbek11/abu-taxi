# Sayt va API bitta domenda (same-origin): refresh cookie, Socket.IO va fayllar CORS'siz ishlaydi.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 30m;   # 5 ta rasm × 5MB

    # Botning ichki API'si faqat docker tarmog'idan (bot → http://api:4000) — tashqaridan yopiq
    location /api/v1/internal/ { return 404; }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    # Lokal fayl saqlash (STORAGE_DRIVER=local)
    location ~ ^/(uploads|files)/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }

    # Vite build'dagi hash'li fayllar — uzoq kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA: service worker va manifest har doim yangisi olinadi
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: barcha boshqa yo'llar index.html'ga (React Router)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri /index.html;
    }
}
